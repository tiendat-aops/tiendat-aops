<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Tien Dat Nguyen: LLMs, intelligent agents, and AI for education">
  <title>Tien Dat Nguyen: LLMs, intelligent agents, and AI for education</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .in { animation: in .5s ease-out both; }
    .d1 { animation-delay: .3s; } .d2 { animation-delay: .9s; } .d3 { animation-delay: 1.4s; }
    .d4 { animation-delay: 2s; } .d5 { animation-delay: 3.2s; } .d6 { animation-delay: 4.6s; } .d7 { animation-delay: 5.2s; }
    .reject { animation: reject .5s ease-out 4.6s both; }
    .cursor { animation: blink 1.1s steps(2, jump-none) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes reject { from { opacity: 1; } to { opacity: .42; } }
    @keyframes blink { from { opacity: 1; } to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .in, .reject, .cursor { animation: none; } }
  </style>
  <rect width="900" height="280" rx="14" fill="#0f1b33"/>
  <g class="in d1"><text class="mono" x="44" y="66" font-size="16" fill="#7fb0ff">$ whoami<tspan class="cursor" fill="#7fb0ff"> ▌</tspan></text></g>
  <g class="in d2"><text x="44" y="116" font-size="42" font-weight="700" fill="#ffffff">Tien Dat Nguyen</text></g>
  <g class="in d3">
    <text x="44" y="156" font-size="18" fill="#c8d6ee">LLMs, intelligent agents, and AI for education</text>
    <text x="44" y="186" font-size="15" fill="#8fa3c4">Teaching Assistant at VNU-UET, Hanoi</text>
    <text x="44" y="210" font-size="15" fill="#8fa3c4">Research collaborator, LRE Lab at ETH Zurich</text>
  </g>
  <rect x="490" y="24" width="386" height="232" rx="12" fill="#17274a" stroke="#2c4170"/>
  <text class="mono" x="510" y="52" font-size="13" fill="#8fa3c4">what a good LLM tutor should do</text>
  <g class="in d4">
    <rect x="672" y="68" width="186" height="38" rx="12" fill="#2c4170"/>
    <text x="765" y="92" font-size="15" text-anchor="middle" fill="#ffffff">12 × 4 = 46, right?</text>
  </g>
  <g class="in d5"><g class="reject">
    <rect x="508" y="118" width="226" height="38" rx="12" fill="#3a2230" stroke="#b5475a"/>
    <text x="524" y="142" font-size="15" fill="#f2c4cc">No. The answer is 48.</text>
    <path d="M708 131l12 12m0-12-12 12" stroke="#ff6b81" stroke-width="2.500" stroke-linecap="round"/>
  </g></g>
  <g class="in d6">
    <rect x="508" y="168" width="350" height="38" rx="12" fill="#1c3a2c" stroke="#3f9c6b"/>
    <text x="524" y="192" font-size="15" fill="#c9f0da">Close! Can you re-check what 2 × 4 gives?</text>
  </g>
  <g class="in d7"><text class="mono" x="510" y="234" font-size="13" fill="#7fd6a4">guide the student, don't reveal the answer</text></g>
</svg>
